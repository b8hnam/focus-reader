name: Feature idea / پیشنهاد قابلیت
description: Suggest something — with realistic expectations. / پیشنهاد بدهید، با انتظار واقع‌بینانه.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This is a personal project with no public roadmap — ideas are read and kept as a record, but there's no guarantee anything gets built unless it's also something the author wants for their own use. A pull request has a much better chance of landing.

        این یک پروژه‌ی شخصی است و نقشه‌ی راه عمومی ندارد — پیشنهادها خوانده و ثبت می‌شوند، اما تضمینی نیست ساخته شوند مگر اینکه نویسنده هم برای استفاده‌ی خودش همان را بخواهد. درخواست ادغام (Pull Request) شانس خیلی بیشتری برای پذیرفته‌شدن دارد.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you start / پیش از شروع
      options:
        - label: I understand this may never be built. / می‌دانم که ممکن است هرگز ساخته نشود.
          required: true
        - label: I searched existing issues. / مشکل‌ها و پیشنهادهای ثبت‌شده را جست‌وجو کردم.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem / مسئله
      description: What are you trying to do that the extension makes hard today? / می‌خواهید چه کاری بکنید که افزونه امروز سختش می‌کند؟
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: The idea / پیشنهاد
      description: What would it look like inside the panel or the settings? / در پنجره یا تنظیمات چه شکلی می‌شود؟
    validations:
      required: true

  - type: dropdown
    id: offer
    attributes:
      label: Would you build it? / خودتان می‌سازیدش؟
      options:
        - I would send a pull request / درخواست ادغام می‌فرستم
        - I could help test it / می‌توانم در آزمودنش کمک کنم
        - No, just suggesting / نه، فقط پیشنهاد است
    validations:
      required: true
